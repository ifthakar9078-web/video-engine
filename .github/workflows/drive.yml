# Drive workflow — the Google Drive stages of the AI Video Compiler (TOOL SPEC v3).
# Placement: .github/workflows/drive.yml in ifthakar9078-web/video-engine
# (drive.py + render_bundle.py must sit at the repo root — checked out below).
#
# Flow per run: Google auth as the owner (OAuth refresh token exchanged for
# a short-lived access token — service accounts have no Drive storage quota,
# so all Drive writes must run under the owner's identity) -> plan (skip
# heavy setup when there is nothing to do) -> drive.py:
# CUTTER takes new videos from the Drive "Video Inbox" one by one, Gemini
# analyses each, scenes are cut into the category pool folders in "Video
# Pools"; MERGER builds one 61-90s compilation from any pool with >= 70s of
# unused clips (fresh Gemini script, Kokoro voice, render_bundle.py),
# uploads it to "Video Finished", publishes a GitHub Release asset and
# reports to the board Worker.
#
# Required repo secrets: QUEUE_KEY, GEMINI_API_KEY, GOOGLE_OAUTH_CLIENT_ID,
# GOOGLE_OAUTH_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN (all set).
name: drive

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which stage(s) to run"
        required: false
        default: "both"
        type: choice
        options:
          - cutter
          - merger
          - both
      max_sources:
        description: "Max new Inbox sources for the cutter"
        required: false
        default: "4"
        type: string
  # Live schedule: Drive writes run under the owner's OAuth token
  # (ifthakar9078@gmail.com owns the folders; service accounts have no Drive
  # storage quota). Cutter test passed 2026-11-19 (run 44546106989).
  schedule:
    - cron: "15,45 * * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: drive
  cancel-in-progress: false

jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      QUEUE_URL: "https://video-compiler-queue.hi-rajabahmad.workers.dev"
    steps:
      - name: Check out engine repo
        uses: actions/checkout@v4

      - name: Get Drive access token (owner OAuth)
        id: auth
        env:
          OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$OAUTH_CLIENT_ID" \
            -d "client_secret=$OAUTH_CLIENT_SECRET" \
            -d "refresh_token=$OAUTH_REFRESH_TOKEN" \
            -d "grant_type=refresh_token" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then echo "OAuth token exchange failed"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "access_token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Plan — skip heavy setup when there is no work
        id: plan
        env:
          DRIVE_TOKEN: ${{ steps.auth.outputs.access_token }}
          MODE: ${{ inputs.mode || 'cutter' }}
          MAX_SOURCES: ${{ inputs.max_sources }}
        run: |
          cat > plan.py <<'PYEOF'
          import json, os, urllib.request, urllib.parse
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) video-compiler-engine"
          QUEUE_URL = os.environ.get("QUEUE_URL", "https://video-compiler-queue.hi-rajabahmad.workers.dev").rstrip("/")
          TOKEN = os.environ.get("DRIVE_TOKEN", "")
          MODE = (os.environ.get("MODE") or "both").strip().lower()
          if MODE not in ("cutter", "merger", "both"): MODE = "both"
          try: MAX_SOURCES = int(os.environ.get("MAX_SOURCES") or 4)
          except ValueError: MAX_SOURCES = 4
          DRIVE = "https://www.googleapis.com/drive/v3"
          def get(url, token=False):
              h = {"User-Agent": UA}
              if token: h["Authorization"] = f"Bearer {TOKEN}"
              req = urllib.request.Request(url, headers=h)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read())
          def dlist(folder):
              q = urllib.parse.quote(f"'{folder}' in parents and trashed = false")
              return get(f"{DRIVE}/files?q={q}&pageSize=100&fields=files(id,name,mimeType,size)", token=True).get("files", [])
          work = False
          try:
              board = get(QUEUE_URL + "/api/board")
              settings = board.get("settings") or {}
              if settings.get("paused"):
                  print("board is paused — no work")
              else:
                  try:
                      about = get(f"{DRIVE}/about?fields=user", token=True)
                      print("token user:", (about.get("user") or {}).get("emailAddress"))
                  except Exception as e:
                      print("about check failed:", e)
                  inbox_id = settings.get("inbox_folder_id") or "1QtcFlEcXnKIDDr3NxLL3pTX51iSqDfNn"
                  pools_id = settings.get("pools_folder_id") or "1Cx-EG5V7_1pe_CDYO-9rsRQYS59GSxzD"
                  if MODE in ("cutter", "both") and MAX_SOURCES > 0:
                      done = {s.get("id") for s in (board.get("sources") or [])
                              if s.get("stage") in ("pooled", "failed", "file-error", "duplicate")}
                      raw = dlist(inbox_id)
                      print(f"cutter: inbox listing returned {len(raw)} file(s), done set has {len(done)}")
                      if raw: print("cutter: first file:", {k: raw[0].get(k) for k in ("id", "name", "mimeType", "size")})
                      todo = [f for f in raw
                              if str(f.get("mimeType", "")).startswith("video/")
                              and int(f.get("size") or 0) > 0
                              and f"drive-{f['id']}" not in done]
                      print(f"cutter: {len(todo)} unprocessed source(s)")
                      work = work or len(todo) > 0
                  if MODE in ("merger", "both"):
                      for cat in [f for f in dlist(pools_id)
                                  if f.get("mimeType") == "application/vnd.google-apps.folder"]:
                          pf = next((f for f in dlist(cat["id"]) if f["name"] == "_pool.json"), None)
                          if not pf: continue
                          man = get(f"{DRIVE}/files/{pf['id']}?alt=media", token=True)
                          free = sum(c.get("dur", 0) for c in man.get("clips", []) if not c.get("used"))
                          print(f"pool {cat['name']}: {free:.0f}s free")
                          if free >= 70: work = True
          except Exception as e:
              print(f"plan check failed ({e}) — failing open, work will run")
              work = True
          print("has_work =", work)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"has_work={'true' if work else 'false'}\n")
          PYEOF
          python3 plan.py 2>&1 | tee plan.log

      - name: Set up Python
        if: steps.plan.outputs.has_work == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Kokoro / HuggingFace models
        if: steps.plan.outputs.has_work == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-hf-v1

      - name: Install system tools (ffmpeg, espeak-ng)
        if: steps.plan.outputs.has_work == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python tools (Kokoro TTS)
        if: steps.plan.outputs.has_work == 'true'
        continue-on-error: true
        run: pip install kokoro

      - name: Run Drive stages
        if: steps.plan.outputs.has_work == 'true'
        env:
          OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          QUEUE_KEY: ${{ secrets.QUEUE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'cutter' }}
          MAX_SOURCES: ${{ inputs.max_sources }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          # Mint a fresh token here so the 60-minute expiry cannot bite
          # mid-run after the setup steps.
          export DRIVE_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$OAUTH_CLIENT_ID" \
            -d "client_secret=$OAUTH_CLIENT_SECRET" \
            -d "refresh_token=$OAUTH_REFRESH_TOKEN" \
            -d "grant_type=refresh_token" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$DRIVE_TOKEN" ]; then echo "OAuth token exchange failed"; exit 1; fi
          echo "::add-mask::$DRIVE_TOKEN"
          python3 drive.py 2>&1 | tee drive.log

      - name: Upload drive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-log
          path: |
            drive.log
            plan.log
          if-no-files-found: ignore
          retention-days: 7
