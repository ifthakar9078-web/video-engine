# Production workflow — the pasted-link engine of the AI Video Compiler.
# Placement: .github/workflows/produce.yml in ifthakar9078-web/video-engine
# (produce.py + drive.py + builder.py + render_bundle.py sit at the repo
# root — checked out below).
#
# Flow per run: claim up to 2 queued link jobs from the board -> download
# (Google Drive links via the owner's OAuth token, so non-public files
# shared with the account work; other links via yt-dlp) -> Gemini
# analysis -> cut into the SAME Drive category pools the Drive engine
# uses -> build with the SAME TEMPLATE v3 builder -> deliver to Video
# Finished + GitHub Release -> report DONE to the board.
#
# Failure discipline: Gemini quota exhaustion REQUEUES the job (a later
# run retries it) — jobs are never failed over quota, silence (the v3
# builder pause-compresses voice and RMS-scans before/after rendering),
# or transient errors (in-run backoff retries).
#
# Required repo secrets: QUEUE_KEY, GEMINI_API_KEY, GOOGLE_OAUTH_CLIENT_ID,
# GOOGLE_OAUTH_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN (all set).
name: produce

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Optional: produce this specific queued job id"
        required: false
        type: string
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      QUEUE_URL: "https://video-compiler-queue.hi-rajabahmad.workers.dev"
    steps:
      - name: Check out engine repo
        uses: actions/checkout@v4

      - name: Preflight — skip heavy work when the queue is empty
        id: preflight
        env:
          QUEUE_KEY: ${{ secrets.QUEUE_KEY }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          if [ -n "$JOB_ID" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          N=$(curl -s -A "Mozilla/5.0 video-compiler-engine" -H "X-Queue-Key: $QUEUE_KEY" "$QUEUE_URL/jobs" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for j in d.get('jobs',[]) if j.get('status')=='queued'))" || echo 1)
          echo "queued jobs: $N"
          if [ "$N" = "0" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Get Drive access token (owner OAuth)
        id: auth
        if: steps.preflight.outputs.skip != 'true'
        env:
          OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$OAUTH_CLIENT_ID" \
            -d "client_secret=$OAUTH_CLIENT_SECRET" \
            -d "refresh_token=$OAUTH_REFRESH_TOKEN" \
            -d "grant_type=refresh_token" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then echo "OAuth token exchange failed"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "access_token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Kokoro / HuggingFace models
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-hf-v1

      - name: Install system tools (ffmpeg, espeak-ng)
        if: steps.preflight.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python tools (Kokoro TTS, yt-dlp, imaging)
        if: steps.preflight.outputs.skip != 'true'
        continue-on-error: true
        run: pip install kokoro scipy pillow yt-dlp

      - name: Produce queued link jobs
        if: steps.preflight.outputs.skip != 'true'
        env:
          QUEUE_KEY: ${{ secrets.QUEUE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          # Mint a fresh token here so the 60-minute expiry cannot bite
          # mid-run after the setup steps.
          export DRIVE_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.GOOGLE_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$DRIVE_TOKEN" ]; then echo "OAuth token exchange failed"; exit 1; fi
          echo "::add-mask::$DRIVE_TOKEN"
          python3 produce.py 2>&1 | tee produce.log

      - name: Upload produce log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: produce-log
          path: produce.log
          if-no-files-found: ignore
          retention-days: 7
