# Render workflow for the video compilation engine.
# Placement (once the engine repo exists):
#   this file        -> .github/workflows/render.yml
#   render_bundle.py -> repo root
name: render

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID (names the output artifact final-<job_id>)"
        required: true
        type: string
      bundle_drive_id:
        description: "Google Drive file ID of bundle.zip (preferred - no public link, no approval)"
        required: false
        type: string
        default: ""
      bundle_url:
        description: "Direct download URL of bundle.zip (fallback, used only when no Drive ID)"
        required: false
        type: string
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out engine repo
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core unzip

      - name: Download bundle from Drive
        if: ${{ inputs.bundle_drive_id != '' }}
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BUNDLE_DRIVE_ID: ${{ inputs.bundle_drive_id }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.parse
          data = urllib.parse.urlencode({
              "client_id": os.environ["GOOGLE_OAUTH_CLIENT_ID"],
              "client_secret": os.environ["GOOGLE_OAUTH_CLIENT_SECRET"],
              "refresh_token": os.environ["GOOGLE_REFRESH_TOKEN"],
              "grant_type": "refresh_token"}).encode()
          tok = json.loads(urllib.request.urlopen(
              urllib.request.Request("https://oauth2.googleapis.com/token", data=data)).read())["access_token"]
          fid = os.environ["BUNDLE_DRIVE_ID"]
          req = urllib.request.Request(
              "https://www.googleapis.com/drive/v3/files/" + fid + "?alt=media",
              headers={"Authorization": "Bearer " + tok})
          with urllib.request.urlopen(req) as r, open("bundle.zip", "wb") as fh:
              while True:
                  chunk = r.read(1 << 20)
                  if not chunk:
                      break
                  fh.write(chunk)
          print("downloaded bundle.zip", os.path.getsize("bundle.zip"), "bytes")
          PYEOF
          mkdir -p bundle
          unzip -o bundle.zip -d bundle
          ls -R bundle | head -50

      - name: Download bundle from URL
        if: ${{ inputs.bundle_drive_id == '' }}
        run: |
          curl -fL "${{ inputs.bundle_url }}" -o bundle.zip
          mkdir -p bundle
          unzip -o bundle.zip -d bundle
          ls -R bundle | head -50

      - name: Render (render_bundle.py self-verifies before exiting)
        run: python3 render_bundle.py bundle

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: final-${{ inputs.job_id }}
          path: bundle/final.mp4
          retention-days: 7
          if-no-files-found: error
